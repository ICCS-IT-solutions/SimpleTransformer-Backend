[General]
# Application environment
environment = Development

# Root directory for application data
app_root = .

# Database provider
database_engine = sqlite

[Paths]
# All paths are relative to app_root unless absolute
models_path = Models
checkpoints_path = Checkpoints
vocabulary_source_directory = Vocabulary/source
vocabulary_compiled_directory = Vocabulary/compiled
training_data_path = TrainingData
logs_path = Logs
cache_path = Cache

[TransformerConfig]
# Name of the configuration preset to use when no explicit
# configuration is supplied.
default_model_config = Medium

; Apply the causal (autoregressive) attention mask. This model is a decoder-only
; language model, so position t must not attend to t+1..S; without the mask every
; position sees the whole window and next-token training degenerates into
; copying. It is architecture, so it applies to inference and generation too.
;
; Set false ONLY to continue or reproduce a run trained before the mask existed -
; such checkpoints learned to attend to the future and will behave worse with it.
causal_mask = true

[TrainingConfig]
# Name of the configuration preset to use when no explicit
# configuration is supplied.
default_training_config = AdamW_Default

[SQLite]
connection_string = data.db

[Vocabulary]
num_tokens_large = 20000
num_tokens_medium = 10000
num_tokens_small = 5000

[Server]
host = localhost
port = 5000

[Frontend]
allowed_origin = http://localhost:5173

[Logging]
log_level = Information
log_file = Logs/simpletransformer.log

[Training]
# Whether training may automatically resume from the latest checkpoint
auto_resume = false

# Mid-epoch "temp" checkpoints. The temp checkpoint is the job's resume pointer
# and stores the FULL parameter block - weights, gradients, and the v5 trailer
# carrying AdamW's m and v - so it costs 16 bytes per parameter. At 208.8M
# parameters that is a ~3.34 GB write.
#
# It used to be written once per outer batch, and the outer batch is capped at
# 8 optimiser steps: on a 4.5M-token corpus that is ~560 steps/epoch and
# therefore ~70 writes/epoch, ~234 GB of disk traffic per epoch. The cadence is
# now decoupled from the progress-display grouping.
save_temporary_checkpoints = true

# Write a temp checkpoint after this many optimiser steps. 0 disables the step
# trigger. Default 50 cuts a 560-step epoch from ~70 writes to ~11.
temp_checkpoint_every_steps = 50

# Also write after this many minutes, whichever trigger comes first. 0 disables
# the time trigger. A step interval alone does not bound the COST of a write: at
# 3.34 GB the serialisation and disk flush can take tens of seconds, so a slow
# step rate needs a clock as well as a count. Default 5 minutes.
temp_checkpoint_every_minutes = 5.0

# Number of epochs between persistent named checkpoints (also always written on
# the final epoch). These are NOT overwritten - each filename embeds its epoch and
# loss - so this is what bounds how many full 3.34 GB files accumulate on disk.
# Floored at 5: anything tighter is redundant, because the temp checkpoint above
# already bounds crash loss to a handful of steps.
checkpoint_interval = 5

[Memory]
; Host-memory pressure relief valve. Unlike [Vulkan], which budgets only
; unmanaged GPU buffers, this governs the managed heap: model weights, AdamW
; moment state, gradients and pooled activations.
;
; Enable the valve. false = one bool check per training step, no sampling.
enabled = true

; Also watch machine-wide load (GC MemoryLoadBytes) and fire on the worse
; of the process and system readings. false = this process alone triggers.
monitor_system_pressure = true

; Ceiling for this process, in MB. 0 = auto (80% of system RAM).
; This is a cap, never a licence to exceed the hardware: it is always clamped
; to 95% of physical memory and never below min_quota_mb, so a value larger
; than the machine cannot push the process into swap.
max_quota_mb = 0

; Floor for the resolved quota, in MB. 0 = no floor.
min_quota_mb = 0

; Start of the relief band, as a percent of physical memory, applied to
; max(process, system) when monitor_system_pressure is true. Crossing it
; drops idle pooled device buffers (cheap). Usage must fall back below this
; before any further relief is considered.
lower_bound_percent = 70

; End of the relief band, as a percent of physical memory. Crossing it permits
; the blocking compacting collection. Lowered from 85 so the valve starts
; compacting with more headroom left on a 32 GiB box.
upper_bound_percent = 75

; Evaluate the valve once every N training steps. Sampling process memory
; costs a syscall, so the hot path is a modulo, not a query.
check_every_n_steps = 25

; Minimum sampled ticks between two relief actions. The anti-thrash guard:
; without it a heap that plateaus above the threshold would be collected every
; sample, which is a worse outcome than the pressure being relieved.
;
; Left at 250 on purpose. It used to be the safety net for the Large Object Heap
; churn that the attention softmax cache and the QLoRA per-item scratch buffers
; produced (unpooled `new Tensor(...)` of 8-16 MiB per layer/head/item, which
; only a gen2 GC reclaims). Those are now borrowed from the workspace and
; bounded by workspace_cap_fraction_of_quota, so the pressure that forced this
; guard down to 25 no longer exists. Lowering it now would only risk thrashing
; a fragmented heap.
min_cooldown_steps = 250

; Percent of the activation pool to keep when the valve trims it. The rest
; goes back to the GC, at the cost of re-allocating those activations.
workspace_retain_percent = 50

; Fraction of the quota the activation pool may retain REGARDLESS of pressure.
; This is the part of the fix that needs no valve: the pool was previously
; unbounded, so a long run accumulated one pooled tensor per activation shape
; it ever saw. 0 disables the cap (not recommended for long runs).
;
; Lowered from 0.35 to 0.20. On a 32 GiB box the auto quota resolves to ~25.5 GB,
; so 0.35 let the pool alone retain ~8.9 GB - on top of the parameter block and
; whatever the step is holding live. 0.20 keeps the ceiling near 5 GB.
workspace_cap_fraction_of_quota = 0.20

; Allow a blocking, compacting gen-2 collection past upper_bound_percent.
; Default true because it is the only rung that recovers a fragmented heap, but
; it should be unreachable in steady state: if the pool cap and the cheap rungs
; hold usage below the upper bound, it never fires. Set false where a
; multi-second stall is unacceptable.
allow_blocking_compact = true

; Attention softmax-cache policy. Scaled dot-product attention normally CACHES
; the post-softmax weight matrix so Backward can apply the softmax Jacobian.
; That cache is heads x batch x seq^2 floats and is the single largest
; activation in the model - at seq 2048, 16 heads, batch 8, 16 layers it is
; 32 GiB, and it is what exhausts a 32 GiB machine.
;
; true  = Backward recomputes that matrix instead of holding it. Activation
;         memory drops to O(seq) per head, at roughly a third more attention
;         FLOPs. Verified bit-comparable by
;           dotnet run -- --attention-recompute-selftest
; false = cache (default). Fast path; use when the seq^2 cache fits.
;
; Automatically suppressed while attention dropout is on, because the dropped
; matrix cannot be rebuilt without consuming fresh dropout RNG.
;
; Set TRUE because the active model (embed 1024, seq 2048, 16 layers, 16 heads,
; ff 3072, vocab 20000) cannot hold its seq^2 cache in 32 GiB. Costs roughly a
; third more attention FLOPs; verified equal-output by
;   dotnet run -- --attention-recompute-selftest
; Set back to false for smaller models, where caching is the faster path.
recompute_attention_softmax = true

[Inference]
# Whether inference requests are permitted while training is running
allow_during_training = false
[Vulkan]
; GPU (VRAM) budget for device-local allocations, in MB.
; 0 = auto-detect from the driver (VK_EXT_memory_budget), falling back
; to the device-local heap size. Overrides are clamped to the hardware.
memory_budget_mb = 8192
; Cap on host-visible (system RAM) staging buffers, in MB.
; 0 = auto: a quarter of physical RAM clamped to 1024-8192 MB,
; so the Vulkan pool can never exhaust system memory.
;
; Lowered from 8192 to 2048. This budget is INDEPENDENT of the [Memory] managed
; quota, which auto-resolves to 0.80 x physical = ~25.5 GB on a 31.9 GiB box.
; At 8192 the two summed to ~33.5 GB against ~31.9 GB of RAM, so the machine was
; overcommitted before a single activation was allocated. 2048 keeps the total
; near 27.5 GB and leaves ~4 GB for the OS, the Vulkan driver and native
; allocations the GC heap never sees.
host_memory_budget_mb = 2048
; Max time in ms a recorded GPU batch may take to complete before the waiting
; caller gives up. Keeps a wedged batch (e.g. a future batching bug) failing
; fast with a clear message instead of stalling a training job for minutes.
; Raise it if first-run shader compilation or very large batches need longer.
dispatch_timeout_ms = 30000
